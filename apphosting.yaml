# Firebase App Hosting configuration.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1

# Environment variables. Public Firebase web config is safe to expose; secrets
# (like GEMINI_API_KEY) should come from Cloud Secret Manager:
#   firebase apphosting:secrets:set gemini-api-key
# env:
#   - variable: NEXT_PUBLIC_FIREBASE_API_KEY
#     value: your-web-api-key
#   - variable: NEXT_PUBLIC_SUPERVISOR_EMAILS
#     value: supervisor@your-university.edu
#   - variable: GEMINI_API_KEY
#     secret: gemini-api-key
